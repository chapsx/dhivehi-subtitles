# Installs the app on Android emulators, opens a test video, and saves screenshots + logs
# to branches named claude/test-results-apiNN.
name: Emulator test

on:
  push:
    branches: ["claude/auto-subtitles"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Get whisper.cpp
        run: git clone --depth 1 --branch v1.7.4 https://github.com/ggml-org/whisper.cpp third_party/whisper.cpp

      - name: Get the speech model from the latest released APK
        run: |
          mkdir -p app/src/main/assets/models
          curl -sSL -o released.apk https://github.com/chapsx/dhivehi-subtitles/releases/download/auto-subs-1/DhivehiAutoSubtitles.apk
          unzip -p released.apk assets/models/ggml-dhivehi.bin > app/src/main/assets/models/ggml-dhivehi.bin
          ls -lh app/src/main/assets/models

      - name: Build test APK (phone + emulator CPU)
        run: |
          ./gradlew --no-daemon -PwithX86=true :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app.apk

      - name: Make a test video with speech
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null
          espeak-ng -w speech.wav "Hello. This is a short test of the subtitle app. We are speaking for about ten seconds so the app can listen."
          ffmpeg -v error -y -f lavfi -i "testsrc2=size=1280x720:rate=30" -i speech.wav -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac test.mp4
          ls -lh test.mp4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emulator-test.sh

      - name: Save results to a branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-out/api${{ matrix.api }}
          cd test-out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b results
          echo "run ${GITHUB_RUN_NUMBER} commit ${GITHUB_SHA}" > RUN.txt
          git add -A
          git commit -q -m "Emulator results API ${{ matrix.api }} run ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" results:claude/test-results-api${{ matrix.api }}
